version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hessekhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hessekhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hessekhub_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-hessekhub_core}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hessekhub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: hessekhub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-hessekhub_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-hessekhub_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  redis_data:
  minio_data:

